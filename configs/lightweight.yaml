# Lightweight model for edge deployment or fast experimentation

data:
  hdf5_path: null
  snr_filter: null

model:
  num_classes: 24
  base_channels: 32        # Half the channels
  num_blocks: 1             # Single block per stage
  dropout: 0.1

training:
  epochs: 30
  batch_size: 512
  lr: 0.002
  weight_decay: 0.0001
