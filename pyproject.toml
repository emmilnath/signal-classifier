[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "signal-classifier"
version = "0.1.0"
description = "Deep learning automatic modulation recognition using 1D ResNet on IQ samples"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1",
    "numpy>=1.24",
    "h5py>=3.10",
    "scikit-learn>=1.3",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "tensorboard>=2.15",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.1"]

[project.scripts]
train = "signal_classifier.train:main"
evaluate = "signal_classifier.evaluate:main"

[tool.ruff]
line-length = 100
target-version = "py310"
